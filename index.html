<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    // Aplica el tema guardado antes del primer pintado (evita parpadeo). Por defecto: oscuro.
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="title" aria-label="Tetris">
      <span>T</span><span>E</span><span>T</span><span>R</span><span>I</span><span>S</span>
    </h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section">
          <span class="label">TEMA</span>
          <button id="theme-toggle" type="button" aria-pressed="false">Modo claro</button>
        </div>
      </aside>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <div id="go-extra" class="records-extra hidden">
            <form id="records-form" class="records-form hidden" autocomplete="off">
              <label for="records-name">¡Entras en el Top 5! Tu nombre:</label>
              <div class="records-form-row">
                <input id="records-name" type="text" maxlength="12" placeholder="Nombre" />
                <button id="records-save" type="submit">Guardar</button>
              </div>
            </form>
            <div id="records-go" class="records-box"></div>
          </div>
          <button id="restart-btn">Reiniciar</button>
        </div>
      </div>

      <div id="start-screen" class="overlay">
        <div class="overlay-box">
          <p id="start-title">TETRIS</p>
          <div id="records-start" class="records-box"></div>
          <button id="start-btn" type="button">Jugar</button>
          <button id="records-reset" class="records-reset" type="button">Resetear records</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
